services:
  postgres-oltp:
    image: postgres:17
    environment:
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
    ports:
       - 5432:5432

    volumes:
        - postgres-oltp-data:/var/lib/postgresql/data
    networks:
    - bank-network
networks:
    bank-network:

volumes:
    postgres-oltp-data:

