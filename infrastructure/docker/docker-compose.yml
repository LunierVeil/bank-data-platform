services:
  postgres-oltp:
    image: postgres:17
    environment:
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
    ports:
       - 5432:5432

    volumes:
        - postgres-oltp-data:/var/lib/postgresql/data
    networks:
    - bank-network
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5
  postgres-airflow:
        image: postgres:17
        environment:
            POSTGRES_USER: "${AIRFLOW_USER}"
            POSTGRES_PASSWORD: "${AIRFLOW_PASSWORD}"
            POSTGRES_DB: "${AIRFLOW_DB}"
        ports:
        - 5434:5432

        volumes:
            - postgres-airflow-data:/var/lib/postgresql/data
        networks:
        - bank-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_USER} -d ${AIRFLOW_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    bank-network:

volumes:
    postgres-oltp-data:
    postgres-airflow-data:

